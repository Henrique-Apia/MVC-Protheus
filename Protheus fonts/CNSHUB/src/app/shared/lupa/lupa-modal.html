<po-modal #modal [p-title]="tituloAtual()" p-size="md">
  <div class="lupa-busca">
    <input
      type="text"
      class="lupa-input"
      [(ngModel)]="filtro"
      (keyup.enter)="pesquisar()"
      placeholder="Buscar por código ou nome..."
      autofocus />
    <po-button p-label="Buscar" p-kind="secondary" (p-click)="pesquisar()"></po-button>
  </div>

  <div class="lupa-lista">
    @if (carregando()) {
      <div class="lupa-mensagem">Buscando...</div>
    } @else if (itens().length === 0 && jaPesquisou()) {
      <div class="lupa-mensagem">Nenhum resultado encontrado.</div>
    } @else {
      <table class="lupa-tabela">
        <thead>
          <tr>
            <th class="lupa-col-codigo">Código</th>
            <th class="lupa-col-complemento">Compl.</th>
            <th>Descrição</th>
          </tr>
        </thead>
        <tbody>
          @for (item of itens(); track item.codigo + item.complemento) {
            <tr class="lupa-linha" (click)="selecionar(item)">
              <td>{{ item.codigo }}</td>
              <td>{{ item.complemento || '—' }}</td>
              <td>{{ item.descricao }}</td>
            </tr>
          }
        </tbody>
      </table>
    }
  </div>

  <po-modal-footer>
    <po-button p-label="Fechar" p-kind="secondary" (p-click)="fechar()"></po-button>
  </po-modal-footer>
</po-modal>
