<po-page-default>
  <div class="home-wrapper">
    <div class="home-boas-vindas">
      <h2>Bem-vindo(a), {{ usuario() }}!</h2>
      <p>{{ dataHoje() }}</p>
    </div>

    <app-calendario-semana class="home-calendario"></app-calendario-semana>

    <div class="home-graficos">
      <div class="home-navegacao-mes">
        <po-button p-icon="an an-caret-left" p-kind="tertiary" p-size="small" (p-click)="mesAnterior()"></po-button>
        <span>{{ nomeMes() }} {{ anoSelecionado() }}</span>
        <po-button p-icon="an an-caret-right" p-kind="tertiary" p-size="small" (p-click)="mesSeguinte()"></po-button>
      </div>

      <po-chart
        [p-series]="serieChamadosOs()"
        [p-categories]="categorias()"
        [p-type]="tipoColuna"
        p-title="Chamados x Ordens de Serviço"
        [p-height]="240">
      </po-chart>
    </div>
  </div>
</po-page-default>
